{% extends 'base.html' %}

{% block title %}心晴研究所-删除活动{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0">确认删除活动</h4>
            </div>
            <div class="card-body text-center">
                <p class="lead">您确定要删除活动 <strong>"{{ activity.title }}"</strong> 吗？</p>
                <p class="text-muted">此操作不可恢复，请谨慎操作。</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">确认删除</button>
                    <a href="{% url 'activity_list' %}" class="btn btn-secondary ml-2">取消</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
