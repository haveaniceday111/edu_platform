{% extends 'base.html' %}

{% block title %}编辑活动 - 教育协作平台{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0">编辑活动</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="{{ form.title.id_for_label }}">活动标题</label>
                        {{ form.title }}
                    </div>
                    <div class="form-group">
                        <label for="{{ form.content.id_for_label }}">活动内容</label>
                        {{ form.content }}
                    </div>
                    <div class="form-group">
                        <label for="{{ form.status.id_for_label }}">活动状态</label>
                        {{ form.status }}
                        <small class="form-text text-muted">草稿状态仅自己可见，发布后所有用户可见。</small>
                    </div>
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="{{ form.start_time.id_for_label }}">开始时间</label>
                            {{ form.start_time }}
                        </div>
                        <div class="form-group col-md-6">
                            <label for="{{ form.end_time.id_for_label }}">结束时间</label>
                            {{ form.end_time }}
                        </div>
                    </div>
                    <div class="form-group text-center">
                        <button type="submit" class="btn btn-warning">保存修改</button>
                        <a href="{% url 'activity_list' %}" class="btn btn-secondary ml-2">返回列表</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
