{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心晴研究所 - 登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background-image: linear-gradient(rgba(40, 167, 107, 0.85), rgba(40, 167, 107, 0.85)),
                              url("{% static 'images/login-bg.png' %}");
            background-size: cover;
            background-position: center;
            color: white;
            text-align: center;
        }

        .title {
            font-size: 60px;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .subtitle {
            font-size: 22px;
            margin-bottom: 40px;
            opacity: 0.95;
        }

        .login-box {
            background: white;
            padding: 40px 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 420px;
            color: #333;
        }

        .login-box h2 {
            color: #28a76b;
            margin-bottom: 25px;
            font-size: 24px;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .btn-login {
            width: 100%;
            padding: 13px;
            background-color: #28a76b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            margin-top: 10px;
            cursor: pointer;
        }

        .btn-login:hover {
            background-color: #21965f;
        }

        .link-register {
            display: block;
            margin-top: 20px;
            color: #28a76b;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="title">心晴研究所</div>
    <div class="subtitle">携手共筑生命健康</div>

    <div class="login-box">
        <h2>账号登录</h2>
        {% if messages %}
            {% for message in messages %}
                <div style="padding: 10px; margin-bottom: 15px; border-radius: 8px; {% if message.tags == 'error' %}background-color: #f8d7da; color: #721c24;{% else %}background-color: #d4edda; color: #155724;{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <input type="text" name="username" placeholder="请输入账号" class="form-input" required>
            <input type="password" name="password" placeholder="请输入密码" class="form-input" required>
            <button type="submit" class="btn-login">登录</button>
        </form>
        <a href="{% url 'register' %}" class="link-register">还没有账号？点击注册</a>
    </div>
</body>
</html>
